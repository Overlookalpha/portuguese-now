<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portuguese Now</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>

    <div class="brand">

    <div class="brand-text">
        <h2>Portuguese Now</h2>
        <span>Learn Brazilian Portuguese Online</span>
    </div>

</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
    </nav>

</header>

<section class="hero">

    <h1>Student Login</h1>

    <p>Students with an active course can sign in below.
Don't have access yet? Buy a course to get started.</p>

   <form class="login-box" id="loginForm">

    <label for="email">Email address</label>
    <input
        type="email"
        id="email"
        placeholder="Email Address"
        autocomplete="email"
        required>

    <label for="password">Password</label>
    <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
        required>

    <button
        id="loginBtn"
        class="btn"
        type="submit">
        Sign In
    </button>

   <p class="login-links">
    <a href="courses.html">Buy a Course</a> |
    <a href="register.html">Create Account</a> |
    <a href="#" id="forgotPassword">Forgot Password?</a>
</p>
</form>

</section>

<script type="module" src="js/login.js"></script>
</body>

</html>
